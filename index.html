    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const yearElement = document.getElementById("currentYear");
        if (yearElement) yearElement.textContent = new Date().getFullYear();

        inisialisasiRoutingAwal();
      });

      function tampilAlert(pesan, jenis = 'warning') {
        const modal = document.getElementById('customAlertModal');
        const icon = document.getElementById('modalAlertIcon');
        const title = document.getElementById('modalAlertTitle');
        const message = document.getElementById('modalAlertMessage');

        if (jenis === 'success') {
          icon.textContent = '✅';
          title.textContent = 'Berhasil';
        } else if (jenis === 'error') {
          icon.textContent = '❌';
          title.textContent = 'Gagal';
        } else {
          icon.textContent = '⚠️';
          title.textContent = 'Perhatian';
        }

        message.innerHTML = pesan;
        modal.style.display = 'flex';
      }

      function closeCustomAlert() {
        document.getElementById('customAlertModal').style.display = 'none';
      }

      // =====================================================
      // ROUTING OTOMATIS SAAT HALAMAN DIBUKA
      // Semua keputusan (terdaftar / invite valid) sudah divalidasi
      // di SERVER (doGet), client di sini cuma menampilkan hasilnya.
      //
      // 1. Sudah terdaftar (email cocok di sheet Pelatih) -> langsung absensi
      // 2. Belum terdaftar TAPI kode undangan VALID (dicek ke sheet Invitations) -> form daftar
      // 3. Selain itu -> AKSES DITOLAK TOTAL (tidak ada fallback ke login manual)
      // =====================================================
      function inisialisasiRoutingAwal() {

        const registerView = document.getElementById("registerView");
        const absenView = document.getElementById("absenView");
        const adminView = document.getElementById("adminView");
        const accessDeniedView = document.getElementById("accessDeniedView");

        if (registerView) registerView.style.display = "none";
        if (absenView) absenView.style.display = "none";
        if (adminView) adminView.style.display = "none";
        if (accessDeniedView) accessDeniedView.style.display = "none";

        // ===============================
        // USER SUDAH LOGIN
        // ===============================
        if (window.__USER__) {

            const data = window.__USER__;

            // ===============================
            // ADMIN
            // ===============================
            if (data.role === "Admin") {

                if (adminView) {
                    adminView.style.display = "block";
                }

                if (typeof loadDashboard === "function") {
                    loadDashboard();
                }

                return;
            }

            // ===============================
            // PELATIH
            // ===============================

            document.getElementById("displayIDPelatih").innerText = data.id;
            document.getElementById("displayNamaPelatih").innerText = data.nama;
            document.getElementById("displayUKMPelatih").innerText = data.ukm;

            if (absenView) {
                absenView.style.display = "flex";
            }

            if (typeof inisialisasiAbsenView === "function") {
                inisialisasiAbsenView();
            }

            return;
        }

        // ===============================
        // INVITATION
        // ===============================
        if (window.__INVITE_STATUS__ === "success") {

            if (registerView) {
                registerView.style.display = "flex";
            }

            const inviteInput = document.getElementById("inviteCodeHidden");
            if (inviteInput) {
                inviteInput.value = window.__INVITE_CODE__;
            }

            const emailText = document.getElementById("detectedEmailText");
            if (emailText) {
                emailText.innerText = window.__DETECTED_EMAIL__;
            }

            if (typeof loadUKM === "function") {
                 loadKategoriKegiatan();
            }

            return;
        }

        // ===============================
        // ACCESS DENIED
        // ===============================
        if (accessDeniedView) {
            accessDeniedView.style.display = "flex";
        }

        const pesan = document.getElementById("accessDeniedMessage");
        if (pesan) {
            pesan.innerText = window.__ACCESS_DENIED_MESSAGE__ || "";
        }

      }
      
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function () { window.history.go(1); };
      </script>
