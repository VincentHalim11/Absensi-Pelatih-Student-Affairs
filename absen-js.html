  // =====================================================
  // GPS
  // =====================================================
  function mintaGPSOtomatis() {

  if (!navigator.geolocation) {
    const teks = document.getElementById("globalGPSTeks");
    if (teks) teks.innerText = "GPS Tidak Didukung Browser.";
    return;
  }

  // Jangan membuat watcher baru kalau sudah ada
  if (watchId !== null) {
    return;
  }

  watchId = navigator.geolocation.watchPosition(

    function (pos) {

      const lat = document.getElementById("globalLat");
      const lng = document.getElementById("globalLong");

      const latitude = pos.coords.latitude;
      const longitude = pos.coords.longitude;
      const accuracy = pos.coords.accuracy;
      window.gpsReady = true;
      //tambahan validasi (klo tambah error hapus saja)
      if (accuracy > 100) {
        window.gpsReady = false;
        window.diDalamArea = false;
        const box = document.getElementById("globalGPSBox");
        const teks = document.getElementById("globalGPSTeks");
        box.className = "location-global-box gps-danger";
        teks.innerHTML =
            `⚠️ GPS belum akurat (±${Math.round(accuracy)} m).<br>
            Silakan tunggu beberapa detik atau pindah ke area yang lebih terbuka.`;
        cekKesiapanClockIn();
        return;
      }
      //stop

      const jarak = hitungJarak(
        latitude,
        longitude,
        OFFICE_LAT,
        OFFICE_LNG
      );

      window.jarakGPS = jarak;

      console.log("Latitude :", latitude);
      console.log("Longitude:", longitude);
      console.log("Accuracy :", pos.coords.accuracy);
      console.log("Jarak:", Math.round(jarak));

      if (lat) lat.value = latitude;
      if (lng) lng.value = longitude;

      const box = document.getElementById("globalGPSBox");
      const teks = document.getElementById("globalGPSTeks");

      if (box && teks) {

        if (jarak <= MAX_DISTANCE) {

          window.diDalamArea = true;
          box.className = "location-global-box gps-success";
          teks.innerHTML =
            `✅ Dalam area latihan (${Math.round(jarak)} m)<br>
            Accuracy: ±${Math.round(pos.coords.accuracy)} m`;

          const kontrolQR = document.getElementById("kontrolAktifasiQR");
          if (kontrolQR) {
              kontrolQR.style.display = "none";
          }

          const statusQR = document.getElementById("statusTeksQR");
          if (statusQR) {
              statusQR.innerHTML = "✅ Selfie tidak diperlukan.";
          }

        } else {
          window.diDalamArea = false;
          box.className = "location-global-box gps-danger";
          teks.innerHTML =
            `📍 GPS Terkunci (${Math.round(jarak)} m dari lokasi latihan)<br>
              Accuracy: ±${Math.round(pos.coords.accuracy)} m`;

          const kontrolQR = document.getElementById("kontrolAktifasiQR");
            if (kontrolQR) {
                kontrolQR.style.display = "flex";
            }

            const statusQR = document.getElementById("statusTeksQR");
            if (statusQR) {
                statusQR.innerHTML =
                    "⚠️ Anda berada di luar area latihan. Silakan ambil foto Selfie.";
            }

        }

      }

      cekKesiapanClockIn();

    },

    function (err) {

      console.log(err);

      const teks = document.getElementById("globalGPSTeks");

      if (teks)
        teks.innerHTML = "Wajib mengizinkan lokasi (GPS) untuk absen!";

    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }

  );

}

  function cekKesiapanClockIn(){
    const btn = document.getElementById("submitClockIn");
    if(!btn) return;
    // Tombol hanya mati kalau GPS belum siap
    btn.disabled = !window.gpsReady
  }

  // =====================================================
  // CLOCK IN
  // =====================================================
  function eksekusiClockIn() {

    if(window.isSubmittingClockIn){
    return;
    }

    // GPS belum siap
    if(!window.gpsReady){
        tampilAlert(
            "GPS masih belum siap. Silakan tunggu beberapa detik.",
            "warning"
        );
        return;
    }

    // CEK foto selfie
    if (window.jarakGPS > MAX_DISTANCE &&!window.stringFotoBase64) {
      if (typeof tampilAlert === "function") {
        tampilAlert("Anda wajib menyertakan Foto Selfie Masuk!", "warning");
      }
      return;
    }

    const btn = document.getElementById("submitClockIn");
    if(!btn) return;
    // Jangan ubah status tombol saat sedang mengirim
    window.isSubmittingClockIn = true;

    // Mulai loading
    const d = new Date();
    const jamFormat = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);

    const dataPack = {
      idPelatih: document.getElementById('displayIDPelatih').innerText,
      nama: document.getElementById('displayNamaPelatih').innerText,
      ukm: document.getElementById('displayUKMPelatih').innerText,

      jamMasuk: jamFormat,

      latMasuk: document.getElementById('globalLat').value,
      longMasuk: document.getElementById('globalLong').value,

      fotoMasuk: window.stringFotoBase64,// nanti diisi URL Drive
      status: "Sedang Latihan"
    };
    
    btn.disabled = true;
    btn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim data...';

    google.script.run
      .withSuccessHandler(function(res) {
        window.isSubmittingClockIn = false;
        btn.disabled = false;
        btn.innerHTML = `Kirim Absen Masuk <i class="fa-solid fa-circle-check"></i>`;
        if (res.status === "success") {
          if (typeof tampilAlert === "function") tampilAlert(res.message, 'success');
          if (res.status === "success") {
              tampilAlert(
              `Clock In berhasil.
              Selamat berlatih!
              Jangan lupa melakukan Clock Out setelah kegiatan latihan selesai.".`,
              "success");
              // Reset QR
              window.qrTerbacaValue = "";

              // Muat ulang tampilan sesuai status terbaru
              inisialisasiAbsenView();
          }
        } else {
          if (typeof tampilAlert === "function") tampilAlert(res.message, 'error');
        }
      })
      .withFailureHandler(function(e) {
        window.isSubmittingClockIn = false; 
        btn.disabled = false;
        btn.innerHTML = `Kirim Absen Masuk <i class="fa-solid fa-circle-check"></i>`;
        if (typeof tampilAlert === "function") tampilAlert(e.message, 'error');
      })
      .clockInServer(dataPack);
  }

  async function kompresFoto(file, maxWidth = 1280, quality = 0.75) {

      return new Promise((resolve, reject) => {

          const reader = new FileReader();

          reader.onload = function(e) {

              const img = new Image();

              img.onload = function() {

                  let width = img.width;
                  let height = img.height;

                  // Batasi lebar maksimal 1280 px
                  if (width > maxWidth) {
                      height = height * (maxWidth / width);
                      width = maxWidth;
                  }

                  const canvas = document.createElement("canvas");

                  canvas.width = width;
                  canvas.height = height;

                  const ctx = canvas.getContext("2d");

                  ctx.drawImage(
                      img,
                      0,
                      0,
                      width,
                      height
                  );

                  canvas.toBlob(
                      function(blob) {

                          if (!blob) {
                              reject(new Error("Gagal mengompres foto."));
                              return;
                          }

                          const readerCompressed = new FileReader();

                          readerCompressed.onload = function(e) {
                              resolve(e.target.result);
                          };
                          readerCompressed.onerror = reject;
                          readerCompressed.readAsDataURL(blob);
                      },
                      "image/jpeg",
                      quality
                  );
              };
              img.onerror = reject;
              img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
      });
  }

  async function prosesFotoSelfie(event) {

      const file = event.target.files[0];

          tampilAlert(

          );

function updateStatusAbsensi(status){

    const card  = document.getElementById("statusAbsensiCard");
    const icon  = document.getElementById("statusAbsensiIcon");
    const title = document.getElementById("statusAbsensiTitle");
    const desc  = document.getElementById("statusAbsensiDesc");

    const stepIn   = document.getElementById("stepClockIn");
    const stepOut  = document.getElementById("stepClockOut");
    const stepDone = document.getElementById("stepSelesai");

    const lineIn  = document.getElementById("lineClockIn");
    const lineOut = document.getElementById("lineClockOut");

    // Reset
    stepIn.classList.remove("active");
    stepOut.classList.remove("active");
    stepDone.classList.remove("active");

    lineIn.classList.remove("active");
    lineOut.classList.remove("active");

    if(status === "clockin"){
        card.className = "status-absensi-card status-clockin";
        icon.className = "fa-solid fa-right-to-bracket";
        title.innerHTML = "CLOCK IN";
        desc.innerHTML = "Silakan lakukan absensi masuk sebelum memulai latihan.";
        stepIn.classList.add("active");

    }

    else if(status === "clockout"){
        card.className = "status-absensi-card status-clockout";
        icon.className = "fa-solid fa-right-from-bracket";
        title.innerHTML = "CLOCK OUT";
        desc.innerHTML = "Silakan lengkapi selfie dan logbook untuk mengakhiri latihan.";
        stepIn.classList.add("active");
        stepOut.classList.add("active");
        lineIn.classList.add("active");

    }

    else if(status === "done"){
        card.className = "status-absensi-card status-selesai";
        icon.className = "fa-solid fa-circle-check";
        title.innerHTML = "SELESAI";
        desc.innerHTML ="Absensi hari ini telah selesai.";
        stepIn.classList.add("active");
        stepOut.classList.add("active");
        stepDone.classList.add("active");
        lineIn.classList.add("active");
        lineOut.classList.add("active");
    }

    else if(status=="pending"){
    card.className = "status-absensi-card status-warning";
    icon.className = "fa-solid fa-triangle-exclamation";
    title.innerHTML = "ABSENSI TERTUNDA";
    desc.innerHTML = "Lengkapi absensi latihan sebelumnya sebelum melakukan Clock In.";

    stepIn.classList.remove("active");
    stepOut.classList.remove("active");
    stepDone.classList.remove("active");

    lineIn.classList.remove("active");
    lineOut.classList.remove("active");
    }
}

function hitungJarak(lat1, lon1, lat2, lon2) {

  const R = 6371000; // meter

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}

function toggleHistory(element){
    const detail = element.nextElementSibling;
    const icon = element.querySelector("i");
    if(detail.style.display === "block"){
        detail.style.display = "none";
        icon.classList.remove("fa-chevron-up");
        icon.classList.add("fa-chevron-down");
    }
    else{
        detail.style.display = "block";
        icon.classList.remove("fa-chevron-down");
        icon.classList.add("fa-chevron-up");
    }
}

function showDashboard(){

  document.getElementById("dashboardContent").style.display = "block";
  document.getElementById("historyContent").style.display = "none";

  document.getElementById("tabDashboard").classList.add("active");
  document.getElementById("tabHistory").classList.remove("active");

}


function showHistory(){
  console.log("1. showHistory dipanggil");

  document.getElementById("dashboardContent").style.display = "none";
  document.getElementById("historyContent").style.display = "block";

  document.getElementById("tabDashboard").classList.remove("active");
  document.getElementById("tabHistory").classList.add("active");

}

//RECOVERY ABSEN
function bukaKameraRecovery(){

    document
        .getElementById("inputRecovery")
        .click();

}

function prosesFotoRecovery(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        window.recoveryFotoBase64 = e.target.result;
        const img = document.getElementById("imgRecovery");
        img.src = window.recoveryFotoBase64;
        img.style.display = "block";
        document.getElementById("btnRecoveryPhoto").innerHTML =
            '<i class="fa-solid fa-camera-rotate"></i> Ambil Ulang Foto';
    };
    reader.readAsDataURL(file);
    event.target.value = "";
}

function submitRecovery(){
    const jamPulang = document.getElementById("recoveryJamPulang").value;
    const logbook = document.getElementById("recoveryLogbook").value.trim();
    const jamMasuk = window.pendingAttendance.jamMasuk;

    if (timeToMinutes(jamPulang) <= timeToMinutes(jamMasuk)) {
        tampilAlert(
            "Jam pulang harus lebih besar dari jam masuk.",
            "warning"
        );
        return;
    }

    if(!jamPulang){
        tampilAlert("Jam pulang wajib diisi.","warning");
        return;
    }

    if(!logbook){
        tampilAlert("Logbook wajib diisi.","warning");
        return;
    }

    if(!window.recoveryFotoBase64){
        tampilAlert("Foto wajib diisi.","warning");
        return;
    }

    const btn = document.getElementById("btnSubmitRecovery");
    btn.disabled = true;
    btn.innerHTML ='<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

    google.script.run
      .withSuccessHandler(function(res){
          btn.disabled = false;
          btn.innerHTML = 'Selesaikan Absensi <i class="fa-solid fa-paper-plane"></i>';
          tampilAlert(res.message,"success");
          inisialisasiAbsenView();
      })
      .submitRecovery({
          row:window.pendingAttendance.row,
          jamPulang:jamPulang,
          logbook:logbook,
          foto:window.recoveryFotoBase64
      });
}

function timeToMinutes(timeString){
  const parts = timeString.split(":");
  const hour = parseInt(parts[0],10);
  const minute = parseInt(parts[1],10);
  return (hour * 60) + minute;
}
